<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h1 style="color: blue;">Check Your Driving Test Eligibility</h1>
    <title>Driving Eligibility Checker</title>
</head>
<body>
    <input type="number" id="age" placeholder="Enter your age">
    <button onclick="sendAge()">Check Age</button>
    <h1 id="output"></h1>
    <script>
        var studAge,descion;
        function sendAge() {
            studAge = document.getElementById("age").value;
           
               if (studAge >= 18) {
                 descion ="You are eligible to take the driving test.";
                 if (studAge >= 70) {
                descion ="Your age is advanced (You are elderly); hire a driver.";
            }
               
            } else {
                if (studAge < 7) {
                    descion="When did you even start walking on your own feet?! Hehehe";

            }else{
                descion ="You are not eligible to take the driving test!";
            }
        }
            document.getElementById("output").textContent = descion;
        }
    </script>
</body>
</html>
