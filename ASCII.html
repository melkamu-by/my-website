<!DOCTYPE html>
<html lang="en">
<head>
    <h1 style="color: blue;"> Enter the ASCII Code</h1>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII</title>
</head>
<body>
   <input type ="text" size="50" onkeydown="sendKeyCode(event)" 
    placeholder="Press any key to see its ASCII code">
   <h1 style="color: rgb(0, 255, 89); font-size: 20px;" id="output"></h1>
    <script>
          function sendKeyCode(event){
                var keyCode = event.key.charCodeAt(0);
                document.getElementById("output").textContent = "The ASCII code of the pressed key is: " + keyCode;
          }
     </script>

</body>
</html>
