<!DOCTYPE html> 
<html>
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A sample page based on university slides"> 
    <title>University Portfolio Page</title> 
 <style> 
        body {
            background-color: lightgrey; 
            font-family: verdana; 
        }
        .container {
            width: 100%;
            text-align: center; 
        }
        .header {
            background-color: #000000; 
            color:red; 
            padding: 10px;
        }
        .nav {
            float: left;
            width: 20%;
            background-color: #888888; 
        }
        .section {
            float: left;
            width: 70%;
            padding: 20px;
            background-color: white;
        }
        h1 { font-size: 300%; } 
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Web Programming Tutorial 2019</h1> 
        </div>
        <div class="nav">
            <h2 id="menu">Main Menu</h2> 
            <ul style="list-style-type:square"> 
                <li><a href="https://www.google.com" target="_blank">Search Engine</a></li> 
                <li><a href="#form-section">Registration</a></li> 
            </ul>
        </div>
        <div class="section" id="form-section">
            <h2>User Registration</h2>
            <p>Please fill out this <b>HTML Form</b> to join.</p> 

            <form action="action_page.php" method="post">
                <fieldset> 
                    <legend>Personal Information:</legend> 
                    
                    First name:<br>
                    <input type="text" name="firstname" placeholder="Enter Name" required> <br> 
                    
                    Gender:<br>
                    <input type="radio" id="male" name="gender" value="male"> <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female"> <label for="female">Female</label> <br><br> 

                    <label for="description">Describe yourself:</label><br>
                    <textarea id="description" name="description" rows="4" cols="30" placeholder="Enter description here..."></textarea> <br> 

                    <!-- JavaScript Triggered Button  -->
                    <input type="button" value="Greet Me" onclick="sayHello()"> 
                    <input type="submit" value="Submit"> 
                </fieldset>
            </form>

            <!-- Table to show data  -->
            <table border="1" style="width:100%; margin-top:20px;">
                <caption>Course List</caption> 
                <tr>
                    <th>Course Name</th> 
                    <th>Code</th>
                </tr>
                <tr>
                    <td>Web Programming</td> 
                    <td>CoSc3082</td>
                </tr>
            </table>
        </div>
    </div>
    <script> 
        function sayHello() {
            alert("Hello! This action was specified by JavaScript."); 
        }
    </script>
</body>
</html>
